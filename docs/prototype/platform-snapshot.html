function navigate(id){current=id;closeMobile();renderNav();let html='';if(id==='home'){html=homeDashboard()}else if(id==='organizations'){html=heading('PT Sorak Digital Media','Organization overview and connected networks.',action('Explore channels','channels',true))+stats()+`<div class="columns">${organizationPanel()}<div>${sidePanel()}</div></div>`}else if(id==='channels'){html=heading('Channels','Explore the channels connected to your organization.',action('View organization','organizations'))+channelPanel()}else if(id==='partners'){html=heading('Partner networks','The agencies and in-house team in your organization.',action('View organization','organizations'))+`<section class="panel"><div class="panel-head"><div><h2>MCN partners</h2><p>3 connected partner networks</p></div>${ico('network')}</div><div class="table-wrap"><table><thead><tr><th>Partner network</th><th>Legal entity</th><th>Type</th></tr></thead><tbody>${atlas.partners.map((p,i)=>`<tr><td><div class="channel-name"><span class="initial">${['HD','MEA','P2P'][i]}</span>${esc(p.name)}</div></td><td class="muted">${esc(p.alias)}</td><td><span class="badge" style="background:#f2eef9;color:var(--violet)">${p.type==='InHouse'?'In-house':p.type}</span></td></tr>`).join('')}</tbody></table></div><div class="table-foot">PT Sorak Digital Media</div></section>`}else{const desc={analytics:'Explore reporting across your creator ecosystem.',discovery:'Find creators for your next brand collaboration.',campaigns:'Plan and manage your brand collaborations.',applications:'Review creator applications and collaboration opportunities.',contracts:'Manage agreements across your organization and channels.',suites:'Tools for your everyday creator workflow.',users:'Manage workspace members and access.',invitations:'Manage invitations to your workspace.'}[id]||'Manage your workspace preferences and configuration.';html=heading(names[id],desc)+`<section class="panel empty"><span class="org-icon" style="margin:auto;width:54px;height:54px">${ico(id==='discovery'?'search':id==='suites'?'tools':id==='campaigns'?'youtube':'settings')}</span><h2>Continue to ${names[id]}</h2><p>${id==='contracts'?'Your organization has 10 active contracts. Open Contracts to review the agreements and their details.':'Open this module in your Atlas Nexus workspace to access its records and tools.'}</p><a class="btn primary" href="${live+routes[id]}" target="_blank" rel="noopener">Open ${names[id]} ${ico('external')}</a></section>`}document.getElementById('main').innerHTML=html+footer();window.scrollTo(0,0);history.replaceState(null,'','#'+id)}
function openModal(content,label){previousFocus=document.activeElement;let m=document.getElementById('modal');m.hidden=false;m.className='overlay';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.setAttribute('aria-label',label);m.innerHTML=`<div class="drawer"><div class="drawer-top"><span class="muted tiny">${label}</span><button class="icon-btn" onclick="closeModal()" aria-label="Close details">${ico('close')}</button></div>${content}</div>`;document.body.style.overflow='hidden';m.querySelector('button').focus()}
function showChannel(path){let c=atlas.channels.find(c=>c.path===path);openModal(`<img class="drawer-avatar" src="${esc(c.thumbnail)}" alt="${esc(c.name)}" referrerpolicy="no-referrer"><h2>${esc(c.name)}</h2><p class="muted" style="margin:0;font-size:12px">YouTube channel · ${esc(c.partner)}</p><div class="details">${[['Subscribers',c.subscribers],['Views',c.views],['Partner network',c.partner],['Organization',atlas.organization.name]].map(x=>`<div class="detail"><span class="muted">${x[0]}</span><span style="text-align:right;max-width:210px">${esc(x[1])}</span></div>`).join('')}</div><a class="btn primary" style="width:100%" href="${live+c.path}" target="_blank" rel="noopener">Open channel ${ico('external')}</a>`,'Channel details')}
function account(){openModal(`<span class="initial" style="width:60px;height:60px;font-size:18px">AS</span><h2>Atlas Superadmin</h2><p class="muted">Super Administrator</p><div class="details"><div class="detail"><span class="muted">Workspace</span><span>PT Sorak Digital Media</span></div></div><a class="btn primary" href="${live}/app/account" target="_blank" rel="noopener">Manage account ${ico('external')}</a>`,'Your account')}
function closeModal(){let m=document.getElementById('modal');m.hidden=true;m.innerHTML='';document.body.style.overflow='';previousFocus?.focus()}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMobile()}if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();navigate('channels');document.getElementById('channel-search').focus()}let m=document.getElementById('modal');if(!m.hidden&&e.key==='Tab'){let f=[...m.querySelectorAll('button,a[href],input')],first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if(e.target.matches('.tab')&&['ArrowRight','ArrowLeft','Home','End'].includes(e.key)){e.preventDefault();let a=[...document.querySelectorAll('.tab')],i=a.indexOf(e.target),j=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;a[j].click();a[j].focus()}});document.getElementById('sidebar-toggle').innerHTML=ico('menu');document.getElementById('search-icon').innerHTML=ico('search');navigate(names[location.hash.slice(1)]?location.hash.slice(1):'home');syncSidebar();
